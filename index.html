<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MBVQW7KW');</script>
    <!-- End Google Tag Manager -->
    
    <meta charset="UTF-8">
    <title>GA4 & GTM 測試網站</title>
    <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; line-height: 1.6; }
    .card { border: 1px solid #ddd; padding: 15px; border-radius: 8px; margin-bottom: 20px; background: #fafafa; }
    button { padding: 10px 18px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
    .btn-buy { background-color: lightblue; }
    .btn-cart { background-color: #ff9800; color: white; border: none; }
    .btn-submit { background-color: #4caf50; color: white; border: none; }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MBVQW7KW"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <h1>歡迎來到我的 GA4 / GTM 測試網頁！</h1>  
    
    <!-- 測試1 DOM 點擊 (Click ID) -->
    <div class="card">
        <button id="btn-buy" class="btn-buy">購買商品 (測試按鈕)</button>
    </div>

    <!-- 測試2 DataLayer 資料層推送 -->
    <div class="card">
        <p>點擊將商品名稱與金額推送到 dataLayer，讓 GTM 接手讀取變數。</p>
        <button class="btn-cart" onclick="pushAddToCart()">加入購物車 ($2,990)</button>
    </div>

    <!-- 測試3 表單送出按鈕 -->
    <div class="card">
        <h3>實驗 3：表單點擊 (Click ID)</h3>
        <button id="btn-submit-form" class="btn-submit">送出諮詢表單</button>
    </div>

    <!-- 測試4 捲動監聽測試區域 -->
    <div style="height: 1000px; background: #f0f0f0; padding: 15px; margin-top: 20px;">
        <p>↓ 往下滑動網頁以測試 GTM 捲動深度 (Scroll Depth) ↓</p>
    </div>

    <script>
    // 實驗 2 的事件寫法：將資料推送到 window.dataLayer
    function pushAddToCart() {
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        'event': 'custom_add_to_cart',
        'product_name': '無線藍牙耳機',
        'product_price': 2990
      });
      alert('已將商品資料推送到 dataLayer！');
    }
  </script>
    
</body>
</html>
